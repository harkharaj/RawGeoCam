name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The GitHub Ubuntu runner already ships the Android SDK (ANDROID_HOME) with licences accepted;
      # Gradle downloads the exact platform it needs.
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RawGeoCam-apk
          path: app/build/outputs/apk/debug/app-debug.apk
